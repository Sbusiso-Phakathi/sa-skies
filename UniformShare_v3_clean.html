<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#161a33;--mu:#68708f;--pr:#5b4bff;--pr2:#00c2a8;--bd:#e4e7f3;--sh:0 8px 30px rgba(40,40,120,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1120;--card:#1a1d33;--tx:#eef0ff;--mu:#9aa1c7;--bd:#2a2e4d;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1120;--card:#1a1d33;--tx:#eef0ff;--mu:#9aa1c7;--bd:#2a2e4d;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.grad{background:linear-gradient(135deg,var(--pr),var(--pr2))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.2rem;display:flex;gap:8px;align-items:center}.logo i{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:99px;cursor:pointer;color:var(--mu);font-weight:600}
nav button.on{background:var(--pr);color:#fff}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--pr);color:#fff}
.btn.alt{background:transparent;border:1.5px solid var(--bd);color:var(--tx)}.btn.sm{padding:6px 12px;font-size:.85rem}.btn.g{background:var(--pr2);color:#04362f}
main{max-width:1100px;margin:0 auto;padding:20px}
.hero{border-radius:24px;color:#fff;padding:44px 28px;margin-bottom:24px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15}.hero p{margin:0 auto 20px;max-width:560px;opacity:.95}
.hero .btn{background:#fff;color:#2b2380;margin:4px}
.bar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;align-items:center}
.bar input,.bar select{flex:1;min-width:140px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card)}
h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.card video{width:100%;aspect-ratio:16/10;background:#000;display:block}
.cb{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.who{display:flex;align-items:center;gap:10px}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.who b{display:block}.who small,.mu{color:var(--mu)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--pr);padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.tag.f{background:color-mix(in srgb,var(--pr2) 18%,transparent);color:#00846f}
.mini{border-top:1px dashed var(--bd);padding-top:10px;font-size:.88rem}
.mini video{border-radius:12px;margin-top:6px;aspect-ratio:16/9}
.empty{text-align:center;padding:50px 20px;color:var(--mu);border:2px dashed var(--bd);border-radius:20px}
.modal{position:fixed;inset:0;background:rgba(10,10,30,.6);z-index:20;display:grid;place-items:center;padding:16px;overflow:auto}
.box{background:var(--card);border-radius:22px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.box h3{margin:0 0 4px;font-size:1.3rem}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
.box input:not([type=checkbox]):not([type=radio]),.box select,.box textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg)}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{margin:0;display:flex;gap:6px;align-items:center;border:1.5px solid var(--bd);padding:6px 12px;border-radius:99px;font-weight:600;cursor:pointer}
.chk input:checked+span{color:var(--pr)}
.seg{display:flex;gap:8px;margin-bottom:8px}.seg button{flex:1}
.note{background:color-mix(in srgb,var(--pr2) 15%,transparent);border-radius:14px;padding:12px;font-size:.9rem;margin-top:12px}
.err{color:#e5484d;font-size:.85rem;min-height:1.2em}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
.dr{border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.pl{font-size:.8rem;font-weight:600}
.det{display:flex;flex-direction:column;gap:6px;font-size:.85rem}.dl{display:flex;gap:8px;align-items:center}.dl img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:30;font-weight:600}
.card{position:relative}
.badge{position:absolute;top:12px;left:12px;z-index:2;padding:5px 12px;border-radius:99px;font-size:.78rem;font-weight:800;letter-spacing:.03em;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.badge.done{background:#12a150}.badge.part{background:#f59e0b}.badge.open{background:#e5484d}.badge.off{background:var(--pr)}
.card.done{border:2px solid #12a150}
.card .ph{padding:54px 16px 0;font-size:.8rem;color:var(--mu);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:center}.stat b{display:block;font-size:1.8rem}
.stat.s1 b{color:#12a150}.stat.s2 b{color:#e5484d}.stat.s3 b{color:var(--pr)}
.vlock{aspect-ratio:16/10;display:grid;place-items:center;text-align:center;padding:12px;background:var(--bg);color:var(--mu);font-weight:600;font-size:.85rem}
</style><style>
/* Class of 2026 Uniform Drive (additive) */
.ud-splash{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;overflow:auto;background:radial-gradient(circle at 25% 15%,#5b4bff,#1b1560 55%,#0b0a2a);animation:udf .6s}
@keyframes udf{from{opacity:0}to{opacity:1}}@keyframes udp{50%{transform:scale(1.05)}}
.ud-splash .in{max-width:580px}.ud-splash h1{font-family:Georgia,serif;font-size:clamp(2rem,7vw,3.3rem);line-height:1.12;margin:12px 0 14px}
.ud-splash .btn{margin:4px;animation:udp 2.4s infinite}.ud-splash .btn.alt{animation:none}
.ud-gown{font-size:3.2rem;filter:drop-shadow(0 6px 18px #0008)}
.ud-q{font-style:italic;min-height:3em;transition:opacity .5s;margin:6px 0}
.ud-sec{border-radius:24px;padding:26px;margin-bottom:24px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.ud-top{text-align:center;max-width:640px;margin:0 auto 18px}.ud-top h2{font-family:Georgia,serif;font-size:clamp(1.5rem,4vw,2.1rem);margin:10px 0 4px}
.ud-bar{height:12px;border-radius:99px;background:var(--bd);overflow:hidden;margin:12px 0 6px}.ud-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pr),var(--pr2))}
.ud-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ud-lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 20px}
.ud-lv div{border:2px solid var(--lc);border-radius:14px;padding:10px;text-align:center}.ud-lv b,.ud-lv small{display:block}
.ud-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;padding-top:10px}
.ud-f{position:relative;border:3px solid var(--lc,var(--bd));border-radius:18px;padding:18px 10px 12px;text-align:center;background:var(--bg);display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px color-mix(in srgb,var(--lc,#888) 22%,transparent)}
.ud-f.ghost{border-style:dashed;opacity:.65}.ud-f .rb{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--lc);color:#fff;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pic{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:#fff;background:var(--bd)}
.ud-p{font-size:.82rem;border-top:1px dashed var(--bd);padding-top:6px}
.ud-pv{width:64px;height:64px;flex:none}.ud-pv .pic{border-radius:50%;font-size:1.6rem}
.ud-r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}.ud-r b{display:inline-block;min-width:34px;text-align:center}
</style>
<style>
.ud-tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ud-lg{display:inline-flex;border:1.5px solid var(--bd);border-radius:99px;overflow:hidden}.ud-lg button{border:0;background:none;padding:4px 10px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--mu)}.ud-lg button.on{background:var(--pr);color:#fff}
.ud-splash .ud-lg{border-color:#fff6;margin-bottom:10px}.ud-splash .ud-lg button{color:#fff}.ud-splash .ud-lg button.on{background:#fff;color:#2b2380}
.ud-rvb{border:0;background:none;color:var(--pr);font-weight:700;font-size:.8rem;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:2px}.ud-rv{margin:4px 0;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--lc) 14%,transparent)}.ud-rv[hidden]{display:none}
.ud-act{display:flex;gap:6px;justify-content:center;margin-top:auto;padding-top:6px}
.ud-sc{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr 62px;gap:10px;align-items:center;font-size:.88rem;margin:6px 0}.ud-sb{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}.ud-sb i{display:block;height:100%;background:var(--pr2)}
.ud-lite .ud-splash,.ud-lite .ud-splash .btn{animation:none}.ud-lite .ud-splash{background:#1b1560}

/* Mobile hamburger navigation */
.burger{display:none;margin-left:auto;width:44px;height:44px;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;cursor:pointer;padding:0;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.burger span{display:block;width:20px;height:2px;border-radius:2px;background:var(--tx);transition:transform .2s,opacity .2s}
header.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
header.open .burger span:nth-child(2){opacity:0}
header.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:760px){
 header{padding:10px 16px}
 .burger{display:flex}
 header nav,header #usr{display:none;width:100%;margin:0}
 header.open nav{display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid var(--bd)}
 header.open nav button{text-align:left;padding:12px 14px;border-radius:12px;font-size:1rem}
 header.open #usr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 4px;border-top:1px solid var(--bd)}
 header.open #usr .btn{flex:1}
 main{padding:14px}
}
.chk label:has(input:checked){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
.cm{height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px;border:1px solid var(--bd);border-radius:14px;padding:10px;background:var(--bg);margin:10px 0}
.cmm{max-width:80%;align-self:flex-start;background:var(--card);border:1px solid var(--bd);padding:6px 10px;border-radius:14px;word-break:break-word}
.cmm.me{align-self:flex-end;background:var(--pr);color:#fff;border-color:var(--pr)}.cmm small{display:block;opacity:.7;font-size:.7rem}
.cs{display:flex;gap:8px;margin-bottom:8px}.cs input{flex:1}
.ud-n{background:#e5484d;color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-left:4px;font-weight:700}
</style>
</head>

<script>
const ITEMS=["Shoes","Jerseys","Pullover","Tie","Socks","Blazer","Hoodie","Shirt","Trousers","Skirt","Other"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={};
const get=k=>{try{return JSON.parse(localStorage.getItem(k))??mem[k]??null}catch(e){return mem[k]??null}};
const set=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,10);
// video storage (IndexedDB, falls back to memory)
const vmem={};
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open("us",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
async function saveVid(id,blob){vmem[id]=blob;try{const d=await idb();d.transaction("v","readwrite").objectStore("v").put(blob,id)}catch(e){}}
async function getVid(id){if(vmem[id])return vmem[id];try{const d=await idb();return await new Promise(r=>{const q=d.transaction("v").objectStore("v").get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function hydrate(){for(const v of document.querySelectorAll("video[data-vid],img[data-vid]")){const b=await getVid(v.dataset.vid);if(b)v.src=URL.createObjectURL(b);else v.poster=""}}
function checkDur(file){return new Promise(res=>{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);res(v.duration)};v.onerror=()=>res(-1);v.src=URL.createObjectURL(file)})}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}

try{if(/[?&]admin\b/.test(location.search))set("admin",1)}catch(e){}

let view="feed",me=sess(get("session"));

const ago=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});

function nav(){

  if(!me){n.innerHTML="";u.innerHTML=`<button class="btn sm alt" onclick="menu(false);authModal('login')">Log in</button> <button class="btn sm" onclick="menu(false);authModal('signup')">Sign up</button>`;return}
  n.innerHTML=[["feed","Activity"],["requests","Requests"],["offers","Donor offers"],...(me.role=="donor"?[["bulk",me.kind=="company"?"Adopt a school":"Bulk giving"]]:[]),...(me.role!="school"?[["chats","Messages"+(totUnread()?" ("+totUnread()+")":"")]]:[]),["mine","My activity"]].map(([k,l])=>`<button class="${view==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  u.innerHTML=`<span class="mu">${esc(me.name)} · ${me.role}</span> ${get("admin")===1?`<button class="btn sm alt" onclick="menu(false);schoolsModal()">📥 Schools</button> `:""}<button class="btn sm alt" onclick="menu(false);logout()">Log out</button>`;
}
function menu(f){const H=$("#hdr"),o=f===undefined?!H.classList.contains("open"):f;H.classList.toggle("open",o);$("#burger").setAttribute("aria-expanded",o)}

// ===== Private chat (donor <-> family). Storage via get/set so a backend can replace it later =====
const chats=()=>get("chats")||[],saveChats=c=>set("chats",c);
const tkey=(k,a,b)=>k+"|"+[a,b].sort().join("~"),CM={};let chatT=null;
const seekLbl=x=>(x.by=="parent"?"Parent/guardian of ":"")+(x.name||"Seeker").split(" ")[0];
const unread=k=>{const t=chats().find(x=>x.id==k);return t&&me?t.m.filter(m=>m.f!=me.id&&m.at>((t.seen||{})[me.id]||0)).length:0};
const totUnread=()=>me?chats().filter(t=>t.u.includes(me.id)).reduce((n,t)=>n+unread(t.id),0):0;
function chatBtn(other,name,ctx,key,hint){if(!me||!other||other==me.id)return"";const k=tkey(key,me.id,other);CM[k]={o:other,n:name,c:ctx,h:hint||""};const u=unread(k);return `<button class="btn sm alt" onclick="chatOpen('${k}')">💬 Chat privately${u?` <span class="ud-n">${u}</span>`:""}</button>`}
const plChat=(x,p)=>!me?"":me.id==x.uid?chatBtn(p.did,p.dn,"Donation for "+x.name+" · "+p.items.join(", "),"p:"+x.id+":"+p.did,p.meet&&p.meet.spot):me.id==p.did?chatBtn(x.uid,seekLbl(x),"Donation for "+x.name+" · "+p.items.join(", "),"p:"+x.id+":"+p.did,p.meet&&p.meet.spot):"";
function chatOpen(k){const m=CM[k];if(!m)return;const c=chats();let t=c.find(x=>x.id==k);if(!t){t={id:k,u:[me.id,m.o],n:{},c:m.c,m:[],seen:{}};c.push(t)}t.n[m.o]=t.n[m.o]||m.n;t.n[me.id]=t.n[me.id]||(me.role=="donor"?me.org||me.name:me.name);saveChats(c);
  modal(`<h3>💬 ${esc(m.n)}</h3><p class="mu" style="margin:0">${esc(m.c)}</p><div class="note">🛡️ Private between the two of you. Don’t share home addresses, ID numbers or photos of children. Meet only in daytime at a busy public place, with a parent/guardian present.</div><div id="cm" class="cm"></div><div id="cf"></div><div class="row"><button class="btn alt" onclick="closeM();render()">Close</button><button class="btn alt" onclick="chatBlock('${k}')">🚫 Block</button></div>`);
  chatDraw(k);clearInterval(chatT);chatT=setInterval(()=>chatDraw(k),2000)}
function chatDraw(k){const t=chats().find(x=>x.id==k),b=$("#cm");if(!t||!b)return;const sig=t.m.length+"|"+t.blk;
  if(b.dataset.s!=sig){b.dataset.s=sig;b.innerHTML=t.m.map(x=>`<div class="cmm ${x.f==me.id?"me":""}">${esc(x.t)}<small>${new Date(x.at).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></div>`).join("")||'<div class="mu" style="text-align:center;margin:auto">No messages yet. Say hello 👋</div>';b.scrollTop=b.scrollHeight}
  if(unread(k)){const c=chats(),x=c.find(y=>y.id==k);x.seen=x.seen||{};x.seen[me.id]=Date.now();saveChats(c)}
  const bar=$("#cf");if(bar.dataset.b!=String(t.blk)){bar.dataset.b=String(t.blk);bar.innerHTML=t.blk?'<div class="note">🚫 This chat has been closed by one of you.</div>':`<form onsubmit="return chatSend(event,'${k}')" class="cs"><input name="t" maxlength="500" placeholder="Type a message…" autocomplete="off" required><button class="btn g">Send</button></form><button class="btn sm alt" type="button" onclick="chatMeet('${k}')">📍 Suggest a public meetup</button>`}}
function chatSend(e,k){e.preventDefault();const i=e.target.t,v=i.value.trim();if(!v)return false;const c=chats(),x=c.find(y=>y.id==k);if(!x||x.blk)return false;x.m.push({f:me.id,t:v,at:Date.now()});(x.seen=x.seen||{})[me.id]=Date.now();saveChats(c);i.value="";chatDraw(k);return false}
function chatMeet(k){const i=document.querySelector(".cs input");if(!i)return;const h=(CM[k]||{}).h;i.value=h?"Can we meet at "+h+"? It’s a public place in the daytime, and a parent/guardian will be there.":"Can we meet in a public place in the daytime? Suggested: [place], [day] at [time]. A parent/guardian will be there.";i.focus()}
function chatBlock(k){const c=chats(),x=c.find(y=>y.id==k);if(x){x.blk=me.id;saveChats(c);chatDraw(k);toast("Chat closed")}}
function vChats(a){const c=chats().filter(t=>t.u.includes(me.id)).sort((x,y)=>((y.m[y.m.length-1]||{}).at||0)-((x.m[x.m.length-1]||{}).at||0));
  a.innerHTML=`<h2>Messages</h2><p class="mu">Private chats between donors and families to arrange handover. Start one with “💬 Chat privately” on a donation or offer.</p><div class="grid">${c.map(t=>{const o=t.u.find(u=>u!=me.id),l=t.m[t.m.length-1],n=unread(t.id);CM[t.id]={o,n:t.n[o]||"Chat",c:t.c,h:""};return `<div class="card cb"><b>${esc(t.n[o]||"Chat")}${n?` <span class="ud-n">${n} new</span>`:""}</b><span class="mu">${esc(t.c)}</span><span>${l?esc(l.t.slice(0,80)):"No messages yet"}</span><button class="btn sm g" onclick="chatOpen('${t.id}')">Open chat</button></div>`}).join("")||'<div class="empty" style="grid-column:1/-1">No chats yet.</div>'}</div>`}
function go(v){menu(false);view=v;render()}
function render(){nav();const a=$("#app");
  if(!me){a.innerHTML=`<section class="hero grad"><h1>Every learner deserves a uniform 💙</h1><p>Pass it on. Seekers share a short motivational reel, donors give second-hand or new items, and together we get learners school-ready.</p><p style="font-weight:800;font-size:1.1rem">🎉 ${cntDone()} learners sorted so far</p><button class="btn" onclick="authModal('signup','seeker')">I’m a parent or learner (18+) needing uniform</button><button class="btn" onclick="authModal('signup','donor')">I want to donate</button></section>
  <div class="grid"><div class="card cb"><h3>🎥 Seekers</h3><span class="mu">Pick your school and location, choose a full uniform or single items, and post a 3–5 minute video about why it matters.</span></div><div class="card cb"><h3>🎁 Donors</h3><span class="mu">Browse requests, give second-hand or buy new, or post items you want to give away and let learners motivate for them.</span></div><div class="card cb"><h3>📦 Delivery</h3><span class="mu">Drop the wrapped parcel at the learner's school, labelled with their name. The school or family confirms it arrived.</span></div></div>`;return}
  ({chats:vChats,bulk:vBulk,feed:vFeed,requests:vReq,offers:vOff,mine:vMine})[view](a);hydrate()}

const match=x=>(!q||((x.school||"")+" "+x.loc).toLowerCase().includes(q))&&(!fi||x.items.includes(fi));

function vReq(a){
  a.innerHTML=`<div class="bar"><h2>Learners waiting for a uniform</h2>${me.role=="seeker"?`<button class="btn" style="margin-left:auto" onclick="reqModal()">+ Post a request</button>`:""}</div>${filters()}<div class="grid" id="list">${reqCards()}</div>`}
function reqCards(){const l=reqs().filter(x=>match(x)&&!hid(x.id)).reverse();if(!l.length)return `<div class="empty" style="grid-column:1/-1">No requests yet. ${me.role=="seeker"?"Post the first one!":"Check back soon."}</div>`;
  return l.map(r=>`<div class="card ${rst(r)=="done"?"done":""}">${bdg(r)}${vidEl(r)}<div class="cb"><div class="who">${av(r.name)}<div><b>${esc(r.name)}</b><small>${esc(r.school)} · 📍${esc(r.loc)}</small></div></div>${tags(r.items,r.full)}<p style="margin:0">${esc(r.story)}</p>${detHtml(r)}
  ${livePl(r).map(p=>`<div class="mini">✅ <b>${esc(p.dn)}</b> pledged ${esc(p.items.join(", "))} (${p.cond}, ${hoShort(p)}) ${p.rcv?'<span class="tag f">Delivered ✅</span>':'<span class="tag">⏳ Awaiting delivery</span>'} ${plChat(r,p)}</div>`).join("")}
  ${me.role=="donor"&&rst(r)!="done"?`<button class="btn g" style="margin-top:auto" onclick="pledgeModal('${r.id}')">Donate to ${esc(r.name.split(" ")[0])}</button>`:""}</div></div>`).join("")}

function vOff(a){

const hasSC=!!(window.crypto&&crypto.subtle&&window.TextEncoder);
async function hashPw(p,salt){if(!hasSC)return"b64:"+btoa(unescape(encodeURIComponent(salt+p)));const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+p));return"s2:"+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function auth(e,mode){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.email=f.email.trim().toLowerCase();const us=users(),er=m=>{$("#err").textContent=m;return false};
  if(mode=="signup"){
    if(us.some(u=>u.email==f.email))return er("That email is already registered.");
    const ph=normPhone(f.phone);if(!ph)return er("Enter a valid South African mobile number.");
    if(us.some(u=>u.phone==ph))return er("That mobile number is already linked to an account. One account per person.");
    const dv=devId();if(us.filter(u=>u.dev==dv).length>=2)return er("Too many accounts on this device. Please log in to your existing account.");
    const co=f.role=="company",sc=f.role=="school",org=(f.org||"").trim();
    if((co||sc)&&!org)return er(sc?"Enter your school name.":"Enter your company or organisation name.");
    const salt=uid()+uid();
    const u={id:uid(),phone:ph,dev:dv,name:f.name.trim(),email:f.email,salt,pw:await hashPw(f.pw,salt),role:f.role=="donor"||co?"donor":sc?"school":"seeker",kind:f.role=="parent"?"parent":f.role=="adult"?"learner":co?"company":sc?"school":null,org:co||sc?org:"",appr:sc?0:1,agreed:Date.now()};
    us.push(u);set("users",us);me=sess(u)}
  else{const u=us.find(u=>u.email==f.email);let ok=false;
    if(u){if(u.salt)ok=(await hashPw(f.pw,u.salt))==u.pw;else{ok=u.pw==btoa(unescape(encodeURIComponent(f.pw)));if(ok){u.salt=uid()+uid();u.pw=await hashPw(f.pw,u.salt);set("users",us)}}}
    if(!ok)return er("Wrong email or password.");me=sess(u)}
  set("session",me);view="feed";closeM();render();toast("Welcome, "+me.name.split(" ")[0]+"!");udPendOffer();openHash();return false}
